[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hecon"
version = "1.0.0"
description = "Scenario models and teaching tools for From Educational Harvesting to Productive Capacity"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
authors = [{name = "Abhishek Choudhary", email = "ayeai.ayeam@gmail.com"}]
requires-python = ">=3.8"

[project.urls]
Homepage = "https://zistgah.github.io/hecon/"
Source = "https://github.com/zistgah/hecon"

[tool.setuptools]
packages = ["hecon"]
